apiVersion: v1
kind: Namespace
metadata:
  name: weekly-sitrep
---
# SQLite database. Ceph RBD block storage (RWO) -- single writer, same
# pattern as networth / steps-dashboard.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weekly-sitrep-data
  namespace: weekly-sitrep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly-sitrep
  namespace: weekly-sitrep
  labels:
    app: weekly-sitrep
spec:
  replicas: 1
  # Recreate: data PVC is ReadWriteOnce and SQLite wants a single writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weekly-sitrep
  template:
    metadata:
      labels:
        app: weekly-sitrep
    spec:
      # Image runs as uid 10001 (non-root); fsGroup makes the fresh RBD
      # volume at /data writable by it.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: franchyze923/weekly-sitrep:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_MODE
              value: "login"
            - name: APP_TZ
              value: "America/New_York"
            - name: SEED_PROJECTS
              value: "Project A,Project B"
            # --- Keycloak SSO (client secret from out-of-band Secret) ---
            - name: OIDC_DISCOVERY_URL
              value: "https://keycloak.franpolignano.com/realms/homelab/.well-known/openid-configuration"
            - name: OIDC_CLIENT_ID
              value: "weekly-sitrep"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weekly-sitrep-oidc
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: weekly-sitrep-oidc
                  key: SESSION_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weekly-sitrep-data
---
apiVersion: v1
kind: Service
metadata:
  name: weekly-sitrep
  namespace: weekly-sitrep
spec:
  selector:
    app: weekly-sitrep
  ports:
    - port: 80
      targetPort: 8000
---
# Gateway hostname (stable OIDC redirect URL; wildcard DNS already resolves it).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weekly-sitrep
  namespace: weekly-sitrep
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
  hostnames:
    - sitrep.franpolignano.com
  rules:
    - backendRefs:
        - name: weekly-sitrep
          port: 80
