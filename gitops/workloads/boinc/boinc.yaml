# boinc: donate idle CPU cycles to astronomy BOINC projects (2026-08-20).
#
# Projects (all astronomy, per Fran): Einstein@Home (gravitational waves /
# pulsars), MilkyWay@home (galaxy structure N-body), Asteroids@home (asteroid
# shape inversion). Universe@Home was considered but the project completed.
# Account keys come from the out-of-band `boinc-secrets` Secret (template in
# README); until it exists the pods idle harmlessly with no projects attached.
#
# Yield model: this must NEVER cost a real workload anything.
#   - PriorityClass idle-compute (negative value) -> first to be preempted or
#     evicted under pressure; preemptionPolicy Never so it can't bump anyone.
#   - cpu request 100m with no cpu limit -> near-zero CFS weight, so under
#     contention the kernel throttles BOINC toward nothing, but genuinely idle
#     cores get used at full speed. BOINC also runs its science apps at nice 19.
#   - BOINC's own prefs cap cores per node (thermals/power -- desktop-node
#     lives on the Ryzen Proxmox host that hits 84C under full encode load).
#     Defaults to 50%; worker-1/2 have per-node overrides tuned to 7 cores
#     each so both workers match and each roughly keeps up with the Ryzen
#     node's output (4 faster cores). Adjust max_ncpus_pct below to change.
#
# Node placement mirrors media-reencode's hard-won rules: off the gpu box
# (Plex/Frigate/ollama), off control-planes (untainted prod master starved
# etcd under an 8-core encode on 2026-07-15). amd64 fleet = worker-1,
# worker-2, desktop-node, one pod each via anti-affinity. The tainted arm64
# M1 gets its own single-replica StatefulSet at the bottom (boinc/client has
# no multi-arch manifest, so the arm64v8 tag needs a separate template).
#
# StatefulSet (not Deployment): each replica keeps its own 5Gi rook-ceph-block
# PVC of BOINC state, and stable pod names give the projects stable host
# identities, so in-progress work units survive restarts and reschedules.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: idle-compute
value: -100000
preemptionPolicy: Never
globalDefault: false
description: >-
  Scavenger workloads (BOINC etc.): first to be preempted/evicted, never
  allowed to preempt anything else.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boinc-config
  namespace: boinc
data:
  # BOINC-level throttles. BOINC sees the HOST's cores/RAM from /proc, not the
  # container's, so percentages below are of the node, not the pod.
  #
  # The attach sidecar prefers a per-node file
  # (global_prefs_override.<nodeName>.xml) and falls back to this default —
  # a single shared percentage can never give equal core counts on nodes with
  # different core totals, and the workers should match each other and come
  # close to the Ryzen desktop-node's per-core-faster output (Ryzen 3600 core
  # ~1.8x an E5-2660 v2 core, so its 4 cores ~ 7 Xeon cores).
  #
  # Default file (desktop-node, M1):
  #   ncpus 50%  -> 4 of 8 cores on desktop, 3 of 6 on the M1
  #   ram 20% busy/idle -> ~6.4Gi on the 32Gi desktop, ~1.1Gi on the M1
  #     (keep this under the container memory limit or tasks get OOMKilled)
  #   disk 4GB   -> fits the 5Gi PVC with headroom
  # Small work buffer: less wasted work if we scale to 0, faster turnaround.
  global_prefs_override.xml: |
    <global_preferences>
      <run_on_batteries>0</run_on_batteries>
      <max_ncpus_pct>50</max_ncpus_pct>
      <cpu_usage_limit>100</cpu_usage_limit>
      <ram_max_used_busy_pct>20</ram_max_used_busy_pct>
      <ram_max_used_idle_pct>20</ram_max_used_idle_pct>
      <disk_max_used_gb>4</disk_max_used_gb>
      <work_buf_min_days>0.1</work_buf_min_days>
      <work_buf_additional_days>0.25</work_buf_additional_days>
    </global_preferences>
  # worker-1 (12 vCPU): BOINC truncates ncpus*pct/100, so 59% -> 7 of 12.
  # RAM raised to 30% (~4.8Gi of 16Gi, under the 8Gi container limit) so 7
  # concurrent tasks don't starve on the old 20% (~3.2Gi) cap.
  global_prefs_override.k8s-cluster-prod-worker-1.xml: |
    <global_preferences>
      <run_on_batteries>0</run_on_batteries>
      <max_ncpus_pct>59</max_ncpus_pct>
      <cpu_usage_limit>100</cpu_usage_limit>
      <ram_max_used_busy_pct>30</ram_max_used_busy_pct>
      <ram_max_used_idle_pct>30</ram_max_used_idle_pct>
      <disk_max_used_gb>4</disk_max_used_gb>
      <work_buf_min_days>0.1</work_buf_min_days>
      <work_buf_additional_days>0.25</work_buf_additional_days>
    </global_preferences>
  # worker-2 (8 vCPU): 88% -> 7 of 8, matching worker-1. Safe because BOINC
  # runs nice-19 with a 100m request (loses every contention fight) and the
  # idle-compute PriorityClass evicts it first under memory pressure.
  global_prefs_override.k8s-cluster-prod-worker-2.xml: |
    <global_preferences>
      <run_on_batteries>0</run_on_batteries>
      <max_ncpus_pct>88</max_ncpus_pct>
      <cpu_usage_limit>100</cpu_usage_limit>
      <ram_max_used_busy_pct>30</ram_max_used_busy_pct>
      <ram_max_used_idle_pct>30</ram_max_used_idle_pct>
      <disk_max_used_gb>4</disk_max_used_gb>
      <work_buf_min_days>0.1</work_buf_min_days>
      <work_buf_additional_days>0.25</work_buf_additional_days>
    </global_preferences>
  # Sidecar reconciler: waits for the client RPC, keeps prefs synced from this
  # ConfigMap, and (re)attaches any project whose account key is configured.
  # boinccmd run from the data dir picks up gui_rpc_auth.cfg automatically.
  attach.sh: |
    #!/bin/sh
    set -u
    # This shell is the container's PID 1: without a trap it ignores SIGTERM
    # and every pod delete eats the full grace period. sleep runs in the
    # background so the trap fires immediately instead of after the nap.
    trap 'exit 0' TERM INT
    cd /var/lib/boinc
    log(){ echo "[attach] $(date '+%F %T') $*"; }

    until boinccmd --get_host_info >/dev/null 2>&1; do
      log "waiting for boinc client rpc..."
      sleep 5 & wait $!
    done
    log "boinc client is up"

    ensure(){ # $1 attach url, $2 match pattern, $3 account key, $4 display name
      # $2 is matched against the *stored* master URL, which can differ from
      # the attach URL (Einstein redirects einsteinathome.org ->
      # einstein.phys.uwm.edu), so match on a stable hostname fragment.
      [ -n "$3" ] || { log "$4: no account key configured, skipping"; return 0; }
      if boinccmd --get_project_status 2>/dev/null | grep -qi "$2"; then
        return 0
      fi
      log "attaching $4"
      if boinccmd --project_attach "$1" "$3"; then
        log "$4 attached"
      else
        log "$4 attach FAILED (will retry next pass)"
      fi
    }

    # Per-node prefs beat the shared default (NODE_NAME from the downward
    # API) — this is how worker-1/2 get different percentages but equal cores.
    prefs=/config/global_prefs_override.${NODE_NAME:-unknown}.xml
    [ -f "$prefs" ] || prefs=/config/global_prefs_override.xml
    log "using prefs $prefs"

    while true; do
      want=$(md5sum < "$prefs")
      have=none
      [ -f global_prefs_override.xml ] && have=$(md5sum < global_prefs_override.xml)
      if [ "$want" != "$have" ]; then
        cp "$prefs" global_prefs_override.xml
        boinccmd --read_global_prefs_override && log "applied global prefs override"
      fi
      ensure "https://einsteinathome.org/"           "einstein"        "${EINSTEIN_ACCOUNT_KEY:-}"  "Einstein@Home"
      ensure "https://milkyway.cs.rpi.edu/milkyway/" "milkyway"        "${MILKYWAY_ACCOUNT_KEY:-}"  "MilkyWay@home"
      ensure "https://asteroidsathome.net/boinc/"    "asteroidsathome" "${ASTEROIDS_ACCOUNT_KEY:-}" "Asteroids@home"
      sleep 600 & wait $!
    done
---
# Headless service only to satisfy the StatefulSet; nothing dials in.
apiVersion: v1
kind: Service
metadata:
  name: boinc
  namespace: boinc
spec:
  clusterIP: None
  selector:
    app: boinc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boinc
  namespace: boinc
  labels:
    app: boinc
spec:
  serviceName: boinc
  # One pod per allowed node. Scale down (3 -> 1 -> 0) to cut power draw;
  # anti-affinity keeps whatever remains spread out.
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: boinc
  template:
    metadata:
      labels:
        app: boinc
    spec:
      priorityClassName: idle-compute
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: boinc
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-cluster-prod-worker-1
                      - k8s-cluster-prod-worker-2
                      - ubuntu-26-desktop-node
      containers:
        - name: client
          image: docker.io/boinc/client:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # No cpu limit on purpose: idle cores are the whole point, and the
            # tiny request already makes BOINC lose every contention fight.
            limits:
              memory: 8Gi
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
        - name: attach
          image: docker.io/boinc/client:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/attach.sh"]
          env:
            # Lets attach.sh pick the per-node prefs override for this node.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # All optional: pods run (idle) before the Secret exists, and each
            # missing key just skips that project.
            - name: EINSTEIN_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: EINSTEIN_ACCOUNT_KEY
                  optional: true
            - name: MILKYWAY_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: MILKYWAY_ACCOUNT_KEY
                  optional: true
            - name: ASTEROIDS_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: ASTEROIDS_ACCOUNT_KEY
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boinc-config
  volumeClaimTemplates:
    - metadata:
        name: boinc-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 5Gi
---
# Headless service only to satisfy the arm StatefulSet; nothing dials in.
apiVersion: v1
kind: Service
metadata:
  name: boinc-arm
  namespace: boinc
spec:
  clusterIP: None
  selector:
    app: boinc-arm
---
# Separate StatefulSet for the tainted arm64 Mac M1 node, following the
# media-reencode-arm pattern: boinc/client publishes no multi-arch manifest
# (latest is amd64-only; arm64 lives under the arm64v8 tag), and the M1 only
# has ~5.3Gi allocatable so it gets a smaller memory envelope. Same ConfigMap,
# Secret, and yield model as the amd64 fleet; the 50%-cores pref gives it
# 3 of 6 cores, and 20% host RAM ~= 1.1Gi keeps it well under the 3Gi limit.
# Einstein@Home serves aarch64 work (BRP4 pulsar search); MilkyWay/Asteroids
# have no arm64 apps, so their ensure-attach just idles here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boinc-arm
  namespace: boinc
  labels:
    app: boinc-arm
spec:
  serviceName: boinc-arm
  replicas: 1
  selector:
    matchLabels:
      app: boinc-arm
  template:
    metadata:
      labels:
        app: boinc-arm
    spec:
      priorityClassName: idle-compute
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: client
          image: docker.io/boinc/client:arm64v8
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
        - name: attach
          image: docker.io/boinc/client:arm64v8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/attach.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EINSTEIN_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: EINSTEIN_ACCOUNT_KEY
                  optional: true
            - name: MILKYWAY_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: MILKYWAY_ACCOUNT_KEY
                  optional: true
            - name: ASTEROIDS_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: boinc-secrets
                  key: ASTEROIDS_ACCOUNT_KEY
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: boinc-data
              mountPath: /var/lib/boinc
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boinc-config
  volumeClaimTemplates:
    - metadata:
        name: boinc-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 5Gi
